# hpcc worker config — copy to ~/.config/hpcc/worker.toml.
# Loaded by `hpcc worker`.
#
# The worker dials the scheduler with a static `worker_token` (the same
# value must appear in scheduler.toml under `[auth] worker_token`),
# registers itself, then serves Compile RPCs that client daemons send
# directly. The hot path (compile bytes) never touches the scheduler.

# gRPC listen address for incoming Compile RPCs.
listen = ":9092"

# Optional HTTP listen address for the Prometheus /metrics endpoint
# (Phase 5 §5.1). Empty disables the scrape listener; OTLP metric
# push still works regardless via the standard
# OTEL_EXPORTER_OTLP_ENDPOINT env var. Keep this on a separate port
# from `listen` — it's plain HTTP, not TLS.
metrics_listen = ":9192"

# Identity advertised to clients (after scheduler routing). Clients dial
# this address, so it must be reachable from wherever they run. Empty
# `worker_id` auto-generates one at startup; persist it across restarts
# only if you care about stable identity in audit logs.
public_addr = "worker-1.internal:9092"
worker_id   = ""

# Paranoid mode mirrors the scheduler-side flag: clients never carry a
# cache, the worker is the sole reader/writer. If you set this, also
# define at least one [[cache]] block below.
paranoid = false

# TLS for the Compile gRPC server. The scheduler records the SHA-256
# of cert_file at registration and hands that fingerprint to clients,
# which pin against it on dial — so a self-signed cert is fine.
[tls]
cert_file = "/etc/hpcc/worker.crt"
key_file  = "/etc/hpcc/worker.key"

# Scheduler link. The worker_token is a shared secret with the
# scheduler; rotate by editing both sides and bouncing the worker.
[scheduler]
url          = "scheduler.internal:9091"
worker_token = "replace-with-a-long-random-string"
ca_file      = ""  # optional; pin the scheduler's CA cert (PEM)

# Container runtime. Linux drives Firecracker directly via jailer;
# Windows uses the Hyper-V runhcs shim (not implemented yet). Use
# "really_really_dangerous" in dev to skip isolation entirely.
[runtime]
handler = "firecracker"   # or "runhcs-wcow-hypervisor" / "really_really_dangerous"

# Required when handler = "firecracker". Every microVM boots the
# kernel_image hpcc provides (not the user image's), with the prepared
# squashfs rootfs from rootfs_dir attached as /dev/vda. jailer chroots
# firecracker into <run_dir>/firecracker/<vm-id>/root/ and drops to
# uid/gid before exec.
[runtime.firecracker]
firecracker_bin = "/usr/bin/firecracker"
jailer_bin      = "/usr/bin/jailer"
kernel_image    = "/var/lib/hpcc/vmlinux"
rootfs_dir      = "/var/lib/hpcc/rootfs"
run_dir         = "/srv/jailer"
uid             = 1000
gid             = 1000
# boot_args     = "console=ttyS0 reboot=k panic=1 pci=off init=/.hpcc/agent root=/dev/vda ro"

# Required when handler = "runhcs-wcow-hypervisor" (Windows). Uses the
# host's containerd + hcsshim Hyper-V runtime; isolation between hpcc
# state and anything else on the host is containerd-namespace-level.
# Each Start allocates <run_dir>/<container-id>/{src,out} as the host
# backing for the per-Exec mounts the runtime injects at C:\src and
# C:\out. Isolation "hyperv" is the production value (separate utility
# VM per container, kernel boundary); "process" runs the container in
# a Windows Server silo on the host kernel and is only valid where
# nested virtualization isn't available (hosted CI runners, dev
# laptops). Empty isolation falls back to "hyperv".
# [runtime.hcsshim]
# address     = "\\\\.\\pipe\\containerd-containerd"
# namespace   = "hpcc"
# run_dir     = "C:\\ProgramData\\hpcc\\run"
# runtime     = "io.containerd.runhcs.v1"
# snapshotter = "windows"
# isolation   = "hyperv"   # or "process"

# Per-tenant microVM sizing. The worker's total compile budget is
# pool.max_active * vm.vcpus concurrent in-flight compiles.
[vm]
memory          = "2GB"
vcpus           = 4
idle_timeout    = "10m"   # reap a tenant VM after this much idleness
session_timeout = "8h"    # hard cap on a tenant VM's lifetime

[pool]
max_active = 32   # upper bound on concurrent per-tenant VMs

# Pre-built binaries and image-catalogue knobs. The pause_* paths are
# optional — empty falls back to the binaries embedded at build time
# (built from /pause). The agent_* paths point at hpcc-agent builds:
#
#   agent_linux_amd64 / agent_linux_arm64 — required when
#     handler = "firecracker". rootfs.Store injects the matching
#     binary at /.hpcc/agent inside each prepared squashfs image, one
#     path per arch the worker will pull for. Empty is fine for an
#     arch the worker never pulls; PullImage fails fast at request
#     time rather than at startup.
#   agent_windows_amd64 — required when handler =
#     "runhcs-wcow-hypervisor" AND hcsshim.isolation = "hyperv". The
#     agent is bind-mounted alongside pause.exe (under C:\.hpcc) and
#     becomes the OCI entrypoint so the host streams compile
#     inputs/outputs over HvSocket gRPC instead of copyTree-ing every
#     Exec. Not used by process-isolation containers.
#
# advertised_digests is a static list of image digests the worker
# reports in RegisterWorker / Heartbeat in addition to whatever the
# real ImageStore knows about. Useful with the dev-mode
# "really_really_dangerous" handler (no containerd, no image store)
# or to manually pin which toolchains this worker accepts.
# AdvertisedDigests are exempt from idle-image eviction.
#
# idle_timeout is the maximum time an image entry may sit in the
# local catalogue without being used by a Compile before eviction.
# Empty disables eviction. The default is "24h".
# [image]
# pause_linux_amd64   = "/var/lib/hpcc/pause-linux-amd64"
# pause_linux_arm64   = "/var/lib/hpcc/pause-linux-arm64"
# pause_windows_amd64 = "/var/lib/hpcc/pause-windows-amd64.exe"
# agent_linux_amd64   = "/var/lib/hpcc/hpcc-agent-linux-amd64"
# agent_linux_arm64   = "/var/lib/hpcc/hpcc-agent-linux-arm64"
# agent_windows_amd64 = "/var/lib/hpcc/hpcc-agent-windows-amd64.exe"
# advertised_digests  = ["sha256:abc..."]
# idle_timeout        = "24h"

# Worker-side cache backends. Required when paranoid = true; in the
# default mode this can be omitted and clients carry their own caches.
# Schema is the same as the client's [[cache]] blocks.
# [[cache]]
# type     = "disk"
# location = "/var/lib/hpcc/cache"
# max_size = "100G"
