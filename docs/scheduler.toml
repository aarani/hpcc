# hpcc scheduler config — copy to ~/.config/hpcc/scheduler.toml.
# Loaded by `hpcc scheduler`.
#
# The scheduler is a route-only lookup service: workers register +
# heartbeat to it, clients call Route(tenant, image_digest) to get a
# worker address + a short-lived JWT. Compile bytes never traverse
# the scheduler.

# gRPC listen address.
listen = ":9091"

# TLS for the gRPC server. Both clients and workers dial scheduler over
# TLS; the CA must be reachable on their side (or pinned via ca_file in
# their respective configs).
[tls]
cert_file = "/etc/hpcc/scheduler.crt"
key_file  = "/etc/hpcc/scheduler.key"

# Worker authentication. Shared static token workers present at
# `Authenticate`. Must be the same string set in worker.toml under
# `[scheduler] worker_token`. Min length 16.
[auth]
worker_token = "replace-with-a-long-random-string"

# Tenants. Each `[[tenant]]` entry is one namespace boundary. The
# client sends `tenant_id` on AuthRequest; the scheduler picks the
# matching entry and validates the presented JWT against ONLY that
# entry's JWKS, then confirms `iss` and `aud` match. `token_url` is
# served back to clients via the unauthenticated GetTenantIdP RPC so
# they don't hardcode it. At least one tenant is required. See
# docs/plan/multi-tenant.md.
[[tenant]]
id        = "acme"
issuer    = "https://idp.acme.example/"
jwks_url  = "https://idp.acme.example/.well-known/jwks.json"
token_url = "https://idp.acme.example/oauth/token"
audience  = "hpcc"
client_id = "hpcc-acme"        # OAuth client registered with the IdP
scope     = "hpcc"             # both optional; sent on the password grant when non-empty

# Add more tenants by repeating the [[tenant]] block. Each may point
# at a different IdP — a JWT signed by one tenant's IdP but presented
# as another tenant is rejected, because only the named tenant's JWKS
# is ever consulted.
# [[tenant]]
# id        = "globex"
# issuer    = "https://keycloak.globex.example/realms/eng"
# jwks_url  = "https://keycloak.globex.example/realms/eng/protocol/openid-connect/certs"
# token_url = "https://keycloak.globex.example/realms/eng/protocol/openid-connect/token"
# audience  = "hpcc"
# client_id = "hpcc-globex"
# scope     = "hpcc"

# Routing knobs.
#
# - `sticky_tenants` biases routing so identical (tenant, image_digest)
#   pairs land on the worker that already has a warm VM for them.
#   Turning this off spreads load more evenly at the cost of cold-start
#   latency on every dispatch.
[routing]
sticky_tenants = true

# Paranoid mode (§4.13). Only meaningful as a deployment-wide flag —
# both scheduler and workers must agree. When set, clients never carry
# a cache and the worker is the sole reader/writer.
paranoid = false
