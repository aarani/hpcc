<aside class="tweaks" id="tweaks" aria-hidden="true">
  <div class="tweaks-head">
    <span>tweaks</span>
    <button id="tw-close" aria-label="close">×</button>
  </div>
  <div class="tw-row">
    <span class="tw-label">accent</span>
    <div class="tw-swatches" id="tw-accent">
      <button class="tw-sw" data-accent="amber" aria-selected="true" style="background:oklch(0.80 0.135 75)" aria-label="amber"></button>
      <button class="tw-sw" data-accent="cyan" style="background:oklch(0.78 0.13 215)" aria-label="cyan"></button>
      <button class="tw-sw" data-accent="lime" style="background:oklch(0.82 0.16 130)" aria-label="lime"></button>
      <button class="tw-sw" data-accent="rose" style="background:oklch(0.72 0.16 15)" aria-label="rose"></button>
    </div>
  </div>
  <div class="tw-row">
    <span class="tw-label">theme</span>
    <div class="tw-segment" id="tw-theme">
      <button data-theme="dark" aria-selected="true">dark</button>
      <button data-theme="light">light</button>
    </div>
  </div>
  <div class="tw-row">
    <span class="tw-label">grid lines</span>
    <div class="tw-segment" id="tw-grid">
      <button data-grid="off" aria-selected="true">off</button>
      <button data-grid="on">on</button>
    </div>
  </div>
</aside>
