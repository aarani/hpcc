---
layout: default
---
<article class="post">
  <div class="shell">
    <header class="post-head">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
      <h1>{{ page.title }}</h1>
    </header>
    <div class="post-body">
      {{ content }}
    </div>
    <div class="post-foot">
      <a href="{{ '/blog/' | relative_url }}">← all posts</a>
    </div>
  </div>
</article>
