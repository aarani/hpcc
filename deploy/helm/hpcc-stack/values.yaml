# hpcc-stack — demo umbrella chart values.
#
# Everything is wired to work out of the box: the stack generates a
# worker_token and self-signed scheduler/worker TLS at install time
# (stable across upgrades via Secret lookup) and points both hpcc
# subcharts + the observability backends at each other by name.
#
# Toggle individual backends with the per-subchart `enabled` flags;
# each is evaluated as the chart-dependency `condition` in Chart.yaml.

# ---------------------------------------------------------------------
# hpcc subcharts.
# ---------------------------------------------------------------------
# Service names are forced via fullnameOverride so the wiring below
# can refer to them by stable Service names ("scheduler" / "worker")
# regardless of the umbrella release name.
hpcc-scheduler:
  fullnameOverride: scheduler

  # The stack generates the auth + TLS Secrets at install time; the
  # subchart just references them.
  auth:
    existingSecret: hpcc-shared-auth
    existingSecretKey: WORKER_TOKEN
  tls:
    existingSecret: hpcc-scheduler-tls

  # Pre-wired to the seeded Keycloak realm (templates/keycloak-realm.yaml +
  # files/hpcc-demo-realm.json). hpcc requires at least one [[tenant]];
  # if you disable keycloak, replace this with your own IdP details.
  config:
    tenants:
      - id: hpcc-demo
        issuer: "http://keycloak/realms/hpcc-demo"
        jwksUrl: "http://keycloak/realms/hpcc-demo/protocol/openid-connect/certs"
        tokenUrl: "http://keycloak/realms/hpcc-demo/protocol/openid-connect/token"
        audience: "hpcc"
        clientId: "hpcc-cli"

  # OTel: send metrics+traces over OTLP to the in-cluster collector.
  # The Prometheus ServiceMonitor still scrapes /metrics on top —
  # belt-and-suspenders so the Grafana "Prometheus" datasource sees
  # the same data even if the collector is disabled.
  extraEnv:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://otel-collector-opentelemetry-collector:4317
    - name: OTEL_SERVICE_NAME
      value: hpcc-scheduler

  serviceMonitor:
    enabled: true

  # Single replica is fine for a demo.
  replicaCount: 1

hpcc-worker:
  fullnameOverride: worker

  scheduler:
    # In-cluster name of the scheduler Service, fixed via
    # fullnameOverride above. Workers dial it for registration.
    url: "scheduler:9091"
    # The umbrella generates a self-signed CA and signs the scheduler
    # cert with it; workers need to trust that CA explicitly. The
    # bundle is mounted at /etc/hpcc/ca/ca.crt via extraVolumes below.
    caFile: /etc/hpcc/ca/ca.crt

  auth:
    existingSecret: hpcc-shared-auth
    existingSecretKey: WORKER_TOKEN
  tls:
    existingSecret: hpcc-worker-tls

  extraVolumes:
    - name: ca-bundle
      secret:
        secretName: hpcc-stack-ca
        items:
          - key: ca.crt
            path: ca.crt
  extraVolumeMounts:
    - name: ca-bundle
      mountPath: /etc/hpcc/ca
      readOnly: true

  extraEnv:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://otel-collector-opentelemetry-collector:4317
    - name: OTEL_SERVICE_NAME
      value: hpcc-worker

  serviceMonitor:
    enabled: true

  # By default hpcc-worker schedules on every node; in a demo cluster
  # restrict to KVM-capable nodes. Leaving empty lets the chart land
  # on every node — fine for kind clusters with nested virt.
  nodeSelector: {}

# ---------------------------------------------------------------------
# Shared secrets — auto-generated at install time.
# ---------------------------------------------------------------------
# Override if you'd rather supply your own. When `generate: true` (the
# default), the stack creates the Secrets and keeps them stable across
# `helm upgrade` via a lookup() of the existing values.
sharedSecrets:
  generate: true

  # Bit-length of the auto-generated worker_token. >= 16 chars is
  # required by hpcc; 32 hex chars (128 bits) is a safe demo default.
  workerTokenBits: 128

  # Self-signed TLS validity in days. The stack only regenerates
  # certs when the existing Secret is missing — bumping this number
  # on an already-installed release is a no-op until you delete the
  # Secret manually.
  tlsValidityDays: 3650

# ---------------------------------------------------------------------
# Observability backends.
# ---------------------------------------------------------------------
# Each block carries an `enabled` flag that the corresponding
# Chart.yaml `condition` reads. Subcharts ignore the `enabled` key.

# Prometheus + Grafana (+ CRDs, alertmanager, node-exporter,
# kube-state-metrics). Grafana ships pre-provisioned datasources for
# Prometheus; Tempo + Loki are layered on via additionalDataSources.
kube-prometheus-stack:
  enabled: true
  fullnameOverride: kps
  crds:
    enabled: true
  alertmanager:
    enabled: false        # demo: noise we don't need
  prometheus:
    prometheusSpec:
      # Lets the OTel collector remote-write into Prometheus.
      enableRemoteWriteReceiver: true
      # Discover all ServiceMonitors in the namespace, not just ones
      # with our release label — keeps demo wiring simple.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      retention: 24h
      resources:
        requests: { cpu: 100m, memory: 512Mi }
  grafana:
    adminUser: admin
    adminPassword: admin    # demo only; change before exposing
    defaultDashboardsTimezone: utc
    service:
      type: ClusterIP
    additionalDataSources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: false
        jsonData:
          maxLines: 1000
      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo:3100
        isDefault: false
        jsonData:
          httpMethod: GET
          serviceMap:
            datasourceUid: prometheus
          tracesToLogs:
            datasourceUid: loki
            mappedTags: [{ key: service.name, value: service }]

# Traces. Single-binary Tempo with OTLP gRPC + HTTP receivers.
tempo:
  enabled: true
  fullnameOverride: tempo
  tempo:
    metricsGenerator:
      enabled: false        # demo: skip extra component
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

# Logs backend — Loki in SingleBinary mode (zero external storage,
# in-pod filesystem). Pod restart drops history; acceptable for demo.
loki:
  enabled: true
  fullnameOverride: loki
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
  singleBinary:
    replicas: 1
    persistence:
      enabled: false
  # Disable the auxiliary components — SingleBinary mode doesn't use them.
  read: { replicas: 0 }
  write: { replicas: 0 }
  backend: { replicas: 0 }
  chunksCache: { enabled: false }
  resultsCache: { enabled: false }
  gateway: { enabled: false }

# Log shipper — DaemonSet tailing /var/log/pods/*, pushing to Loki.
promtail:
  enabled: true
  fullnameOverride: promtail
  config:
    clients:
      - url: http://loki:3100/loki/api/v1/push

# OpenTelemetry Collector. Receives OTLP from hpcc; exports traces
# to Tempo and metrics to Prometheus via remote-write.
opentelemetry-collector:
  enabled: true
  fullnameOverride: otel-collector
  mode: deployment
  image:
    # contrib build ships prometheusremotewrite + tempo exporters.
    repository: otel/opentelemetry-collector-contrib
  presets:
    kubernetesAttributes:
      enabled: true
  service:
    enabled: true
  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
    exporters:
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true
      prometheusremotewrite:
        endpoint: http://kps-prometheus:9090/api/v1/write
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheusremotewrite]

# OIDC IdP. The `hpcc-demo` realm (one client `hpcc-cli`, one user
# `demo`/`demo`, with an audience mapper that stamps "hpcc" into
# access tokens) is auto-seeded via the bitnami keycloak-config-cli
# job — see templates/keycloak-realm.yaml + files/hpcc-demo-realm.json.
#
# KC_HOSTNAME is pinned to the in-cluster service name so the issuer
# URL in tokens stays stable regardless of how clients reach Keycloak.
# External clients fetch tokens via port-forward, then call the
# scheduler directly — they don't need to resolve "keycloak" since
# the token is already in hand by then.
keycloak:
  enabled: true
  fullnameOverride: keycloak
  auth:
    adminUser: admin
    adminPassword: admin
  production: false
  proxy: edge
  service:
    type: ClusterIP
  # Broadcom moved bitnami's free container images to docker.io/bitnamilegacy
  # in August 2025; anything left under docker.io/bitnami requires a paid
  # subscription. The chart still defaults to bitnami/* and 404s on
  # `docker pull`, so redirect each component (keycloak, the realm-import
  # job, and the bundled postgres) to bitnamilegacy. Long-term, hpcc
  # should switch off bitnami — see https://github.com/aarani/hpcc/issues
  # for tracking.
  image:
    registry: docker.io
    repository: bitnamilegacy/keycloak
  # KC_HOSTNAME stamps a stable issuer into every token. Without this
  # the issuer varies by request Host header, which breaks scheduler
  # token validation when internal and external clients use different
  # access paths.
  extraEnvVars:
    - name: KC_HOSTNAME
      value: keycloak
    - name: KC_HOSTNAME_STRICT
      value: "false"
  postgresql:
    enabled: true
    image:
      registry: docker.io
      repository: bitnamilegacy/postgresql
    auth:
      postgresPassword: keycloak
    primary:
      persistence:
        enabled: false        # demo: pod restart wipes the realm; configcli re-imports it

  # Realm auto-import. The job waits for Keycloak to come up, then
  # applies hpcc-demo-realm.json idempotently.
  keycloakConfigCli:
    enabled: true
    existingConfigmap: hpcc-demo-realm
    image:
      registry: docker.io
      repository: bitnamilegacy/keycloak-config-cli
    # Re-run on every upgrade so realm edits flow through.
    cleanupAfterFinished:
      enabled: true
      seconds: 60
