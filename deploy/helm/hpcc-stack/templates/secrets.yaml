{{- if .Values.sharedSecrets.generate -}}
{{- $ns := .Release.Namespace -}}
{{- $validity := .Values.sharedSecrets.tlsValidityDays | int -}}

{{/*
  Worker token — random hex on first install, stable across upgrades
  by reading back the existing Secret.

  sharedSecrets.workerTokenBits → number of hex chars / 4. 128 bits
  becomes 32 hex chars, well above the 16-char minimum hpcc enforces.
*/}}
{{- $tokenBytes := div .Values.sharedSecrets.workerTokenBits 4 | int -}}
{{- $existingAuth := lookup "v1" "Secret" $ns "hpcc-shared-auth" -}}
{{- $token := "" -}}
{{- if and $existingAuth (index $existingAuth.data "WORKER_TOKEN" | default "") -}}
  {{- $token = index $existingAuth.data "WORKER_TOKEN" | b64dec -}}
{{- else -}}
  {{- $token = randAlphaNum $tokenBytes -}}
{{- end -}}

{{/*
  Self-signed CA — generated once and reused so the scheduler/worker
  certs stay valid across upgrades. If the CA Secret is gone, we
  rotate everything (scheduler-tls, worker-tls follow below).
*/}}
{{- $existingCA := lookup "v1" "Secret" $ns "hpcc-stack-ca" -}}
{{- $caCert := "" -}}
{{- $caKey := "" -}}
{{- if and $existingCA (index $existingCA.data "tls.crt" | default "") -}}
  {{- $caCert = index $existingCA.data "tls.crt" | b64dec -}}
  {{- $caKey  = index $existingCA.data "tls.key" | b64dec -}}
{{- else -}}
  {{- $ca := genCA "hpcc-stack-ca" $validity -}}
  {{- $caCert = $ca.Cert -}}
  {{- $caKey  = $ca.Key -}}
{{- end -}}
{{- $caObj := buildCustomCert (b64enc $caCert) (b64enc $caKey) -}}

{{/*
  Scheduler leaf cert — SANs cover every reasonable way the
  in-cluster Service can be addressed. Workers verify the scheduler
  by trusting the CA below; clients outside the cluster trust the CA
  out-of-band (kubectl get secret hpcc-stack-ca -o yaml).
*/}}
{{- $existingSched := lookup "v1" "Secret" $ns "hpcc-scheduler-tls" -}}
{{- $schedCert := "" -}}
{{- $schedKey := "" -}}
{{- if and $existingSched (index $existingSched.data "tls.crt" | default "") -}}
  {{- $schedCert = index $existingSched.data "tls.crt" | b64dec -}}
  {{- $schedKey  = index $existingSched.data "tls.key" | b64dec -}}
{{- else -}}
  {{- $schedSANs := list "scheduler" (printf "scheduler.%s" $ns) (printf "scheduler.%s.svc" $ns) (printf "scheduler.%s.svc.cluster.local" $ns) "localhost" -}}
  {{- $sched := genSignedCert "scheduler" (list "127.0.0.1") $schedSANs $validity $caObj -}}
  {{- $schedCert = $sched.Cert -}}
  {{- $schedKey  = $sched.Key -}}
{{- end -}}

{{/*
  Worker leaf cert — workers run on hostNetwork and advertise the
  node IP, so the certificate's hostname coverage is loose by design
  (a demo can't enumerate node IPs at install time). Clients that
  dial workers directly need InsecureSkipVerify or a custom dialer
  that trusts the CA. Documented in README.
*/}}
{{- $existingWorker := lookup "v1" "Secret" $ns "hpcc-worker-tls" -}}
{{- $workerCert := "" -}}
{{- $workerKey := "" -}}
{{- if and $existingWorker (index $existingWorker.data "tls.crt" | default "") -}}
  {{- $workerCert = index $existingWorker.data "tls.crt" | b64dec -}}
  {{- $workerKey  = index $existingWorker.data "tls.key" | b64dec -}}
{{- else -}}
  {{- $workerSANs := list "worker" (printf "worker.%s" $ns) (printf "worker.%s.svc" $ns) (printf "worker.%s.svc.cluster.local" $ns) "*.local" "localhost" -}}
  {{- $worker := genSignedCert "worker" (list "127.0.0.1") $workerSANs $validity $caObj -}}
  {{- $workerCert = $worker.Cert -}}
  {{- $workerKey  = $worker.Key -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: hpcc-shared-auth
  labels:
    {{- include "hpcc-stack.labels" . | nindent 4 }}
  annotations:
    # Tell helm we don't own this for delete/replace cycles — the
    # token is referenced by both subcharts and shouldn't churn on
    # `helm upgrade`. lookup() above already handles upgrade stability.
    helm.sh/resource-policy: keep
type: Opaque
data:
  WORKER_TOKEN: {{ $token | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: hpcc-stack-ca
  labels:
    {{- include "hpcc-stack.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  tls.crt: {{ $caCert | b64enc }}
  tls.key: {{ $caKey  | b64enc }}
  # Also exposed under ca.crt so the worker's extraVolumeMount
  # below maps the file naturally to /etc/hpcc/ca/ca.crt.
  ca.crt: {{ $caCert | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: hpcc-scheduler-tls
  labels:
    {{- include "hpcc-stack.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  tls.crt: {{ $schedCert | b64enc }}
  tls.key: {{ $schedKey  | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: hpcc-worker-tls
  labels:
    {{- include "hpcc-stack.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  tls.crt: {{ $workerCert | b64enc }}
  tls.key: {{ $workerKey  | b64enc }}
{{- end }}
