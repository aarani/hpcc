# Default values for hpcc-worker.
#
# This chart runs the worker as a StatefulSet on nodes that have
# /dev/kvm. Each pod runs privileged with hostNetwork enabled so
# jailer/firecracker can manipulate cgroups and so the worker can
# advertise the node's IP as its public address (clients dial workers
# directly after scheduler routing).
#
# Replica count is capped at the number of nodes matching the
# nodeSelector/tolerations — one-worker-per-node anti-affinity is
# enforced by the template because hostNetwork+hostPort makes two
# pods on the same node a port collision, not a degraded mode. Set
# replicaCount manually for a fixed pool, or enable autoscaling
# below to let KEDA vary it from cluster-pressure metrics.
#
# Target only KVM-capable nodes by setting nodeSelector or tolerations
# below — running on a node without /dev/kvm will leave the pod stuck
# in CrashLoopBackOff.

# Number of worker pods. Capped by the number of eligible nodes (see
# above). Override per environment or let .Values.autoscaling manage it.
replicaCount: 1

image:
  repository: ghcr.io/aarani/hpcc-worker
  tag: ""                         # empty → Chart.AppVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# --- Worker ↔ scheduler pairing --------------------------------------
scheduler:
  # In-cluster: <release>.<namespace>.svc:<port>. Cross-cluster: an
  # external hostname:port. Workers dial this for registration and
  # heartbeats.
  url: "hpcc-scheduler.hpcc.svc:9091"

  # When the scheduler is signed by a private CA, set caFile to the
  # in-pod path of the CA bundle (mount it via extraVolumes/Mounts).
  # Leave empty to trust the system store.
  caFile: ""

# --- Auth (worker_token) ---------------------------------------------
# Either set the value directly (chart-managed Secret) or point at an
# existing Secret. The latter pairs naturally with the scheduler chart's
# auth.existingSecret — both releases can share one Secret.
auth:
  workerToken: ""
  existingSecret: ""
  existingSecretKey: WORKER_TOKEN

# --- TLS material (worker's own cert) --------------------------------
# Worker presents this to the scheduler and to inbound client calls.
# Provide either an existing Secret with tls.crt/tls.key or paste the
# PEM material.
tls:
  existingSecret: ""
  cert: ""
  key: ""

# --- Worker config ----------------------------------------------------
config:
  existingConfigMap: ""

  # Default to ports inside the Kubernetes NodePort range
  # (30000-32767). Managed Kubernetes providers (OVH, scaleway,
  # some on-prem distros) leave that range open through their
  # perimeter firewalls by default but block arbitrary high ports,
  # so binding workers there is the easiest way to make them
  # reachable from outside the cluster without per-cluster firewall
  # tweaks.
  listen: ":30092"
  metricsListen: ":30192"   # set to "" to disable

  # public_addr is built at pod start from $NODE_IP so every pod
  # advertises the IP of the node it runs on (one pod per node;
  # see anti-affinity in templates/statefulset.yaml). Keep this in
  # sync with `listen`.
  publicAddrPort: 30092

  # How to discover that node IP. Options:
  #
  #   externalIP   default. kubectl-queries the Node object for its
  #                ExternalIP address; falls back to the downward API's
  #                status.hostIP (the cluster-internal address) when
  #                no ExternalIP is set, so private clusters keep
  #                working. Requires the worker ServiceAccount to have
  #                `get nodes` cluster-wide — see the rendered
  #                ClusterRole/ClusterRoleBinding.
  #
  #   hostIP       legacy behaviour. Uses status.hostIP from the
  #                downward API only. No RBAC needed; fine for clusters
  #                whose nodes have a single addressable IP that
  #                external clients can reach.
  publicAddrSource: externalIP

  # Per-worker disk cache. Required for CAS-mode dispatch — without it
  # the worker rejects upload probes with FailedPrecondition and the
  # client falls back to local compilation. emptyDir backing means the
  # cache evaporates on pod restart; for warm cache survival across
  # restarts, replace with a hostPath or PVC and bump `sizeLimit` to
  # match.
  cache:
    enabled: true
    location: /var/cache/hpcc
    maxSize: "10G"

  runtime:
    handler: firecracker
    firecracker:
      uid: 1000
      gid: 36                       # matches kvm group baked into the worker image
      vm:
        memory: "2GB"
        vcpus: 4
        idleTimeout: "10m"
        sessionTimeout: "8h"
      pool:
        # Upper bound on concurrent per-tenant microvms. Worker-wide
        # compile capacity is maxActive * vm.vcpus (see
        # internal/worker/worker.go capacitySnapshot), so this should
        # track the node's CPU count to avoid oversubscription.
        #
        # 0 (default) → auto-size at pod start: max_active = max(1,
        # cpu_allotment / vm.vcpus), where cpu_allotment is derived
        # from the pod's cgroup CPU quota (cgroup v2: /sys/fs/cgroup/
        # cpu.max; v1: cpu.cfs_quota_us / cpu.cfs_period_us). Falls
        # back to nproc when the cgroup reports "unlimited" — typical
        # when no resources.limits.cpu is set on the pod. Set a
        # positive integer to pin a specific value when reserving
        # cores for the host or co-tenant workloads.
        maxActive: 0

# --- /dev/kvm handling -----------------------------------------------
# Most nodes ship /dev/kvm as root:kvm 0660 with kvm at an arbitrary
# GID. The worker image's hpcc user is in gid 36 (Debian/Ubuntu kvm
# group); on other distros the GIDs won't match and jailer-after-drop
# can't open the device. Easiest fix: an initContainer chmods it 0666.
# Disable if your nodes already mount /dev/kvm world-accessible or if
# you use a device plugin that handles permissions.
kvm:
  fixOwnership: true

# --- Networking -------------------------------------------------------
# hostNetwork is required so clients can dial the worker at the node's
# routable IP. hostPID stays false — jailer doesn't need it.
hostNetwork: true
dnsPolicy: ClusterFirstWithHostNet

# --- Scheduling -------------------------------------------------------
# Restrict to bare-metal / nested-virt nodes. The chart can't probe
# /dev/kvm presence; label nodes with `hpcc.io/kvm=true` (or similar)
# and select on that. Defaults are empty so this stays opt-in.
nodeSelector: {}
tolerations: []
affinity: {}

resources: {}
  # requests: { cpu: 500m, memory: 1Gi }
  # limits:   { cpu: 4,    memory: 8Gi }

podAnnotations: {}
podLabels: {}

# Extra environment variables for the worker container. The OTel
# umbrella chart (hpcc-stack) uses this to inject OTEL_EXPORTER_OTLP_*.
extraEnv: []
  # - name: OTEL_EXPORTER_OTLP_ENDPOINT
  #   value: http://otel-collector:4317

# --- Storage ---------------------------------------------------------
# Per-pod scratch space for jailer chroots and rootfs squashfs cache.
# emptyDir is fine for ephemeral state — the worker re-stages on every
# microvm launch. Override sizeLimit and medium per node capacity.
volumes:
  rootfs:
    sizeLimit: ""
    medium: ""              # "" or "Memory"
  run:
    sizeLimit: ""
    medium: ""
  cache:
    sizeLimit: ""           # match config.cache.maxSize if you want
                            # the cgroup to enforce the cap
    medium: ""

# Mount extra files/secrets into the worker container (e.g. a CA bundle
# for scheduler.caFile).
extraVolumes: []
extraVolumeMounts: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

# --- Probes ----------------------------------------------------------
probes:
  liveness:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 15
  readiness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10

# --- Metrics --------------------------------------------------------
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# --- Autoscaling -----------------------------------------------------
# When enabled, renders a KEDA ScaledObject that varies the StatefulSet
# replica count from a Prometheus trigger reading the scheduler's
# cluster-vCPU gauges. The scaling signal is utilization:
#
#   sum(hpcc_scheduler_cluster_vcpus_inuse)
#   ÷ sum(hpcc_scheduler_cluster_vcpus_total)
#
# computed in PromQL inside the trigger. KEDA aims to keep that ratio
# at targetUtilization (0.7 ≈ "scale up when 70% loaded"). With one
# pod per node, maxReplicas should not exceed the number of eligible
# nodes — cluster-autoscaler must add nodes for the cap to grow.
#
# Requires:
#   - KEDA installed in the cluster (the operator watches ScaledObject CRDs)
#   - A Prometheus reachable from KEDA at prometheusServerAddress, with
#     the OTel metric naming convention (dots → underscores) — i.e.
#     the OTel→Prom remap leaves the gauges as
#     hpcc_scheduler_cluster_vcpus_{total,inuse}.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  # Target value for the inuse/total ratio. KEDA's metricType is
  # AverageValue, so the trigger fires when current/replicas > target.
  # 0.7 is a common starting point; lower → more aggressive scale-up.
  targetUtilization: "0.7"
  # In-cluster URL of a Prometheus that scrapes the scheduler. Required.
  prometheusServerAddress: ""
  # Optional label-selector fragment scoping the scheduler instance the
  # metric is sourced from — useful when multiple scheduler releases
  # share a Prometheus. Empty selects all scheduler instances.
  schedulerSelector: ""
  # KEDA cooldown after scale-down (seconds). Conservative default: a
  # freshly-deleted worker pod still has in-flight compiles draining;
  # scaling back up after a brief load dip is cheap, but flapping is
  # expensive.
  cooldownPeriod: 300
  # Optional extra fields merged into the spec — advanced HPA tuning
  # (behavior.scaleDown.policies, fallback, etc.) goes here.
  advanced: {}

# Update strategy. RollingUpdate w/ maxUnavailable=1 by default — bump
# to a percentage on larger fleets.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
