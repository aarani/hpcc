name: Kernel tag bump

# Nightly check: look at amazonlinux/linux for newer microvm-kernel-*
# tags on the 5.10 and 6.1 lines and, if either has moved past what
# scripts/build-kernel.sh currently pins, open a PR with the bump.
#
# The PR has to be merged by hand — we don't want a nightly cron
# silently rewriting CI inputs that govern what binary ships in
# releases. The next v* tag after merge picks the bumped sources up
# automatically via release.yml's kernel matrix.

on:
  schedule:
    # 06:00 UTC ≈ early morning EU / late evening US-west, low traffic.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write        # push the auto/kernel-bump branch
  pull-requests: write   # open or refresh the PR

jobs:
  check:
    name: Check amazonlinux/linux for kernel updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find latest microvm-kernel-* tags
        id: tags
        # ls-remote with a refspec filter is several orders of magnitude
        # cheaper than paginating the GitHub Tags API on a repo with
        # thousands of tags. sort -V handles the dotted-version-plus-
        # dash-separated-amzn-iteration shape cleanly enough that we
        # don't need a Python parser.
        run: |
          set -eu
          latest_for() {
            git ls-remote --tags --refs https://github.com/amazonlinux/linux \
              "refs/tags/microvm-kernel-$1.*" \
              | awk '{print $2}' | sed 's|refs/tags/||' | sort -V | tail -1
          }
          new_510=$(latest_for 5.10)
          new_61=$(latest_for 6.1)

          if [ -z "$new_510" ] || [ -z "$new_61" ]; then
            echo "could not resolve latest tags (5.10='$new_510', 6.1='$new_61')" >&2
            exit 1
          fi

          cur_510=$(awk -F'"' '/5\.10\)[[:space:]]+TAG=/ {print $2}' scripts/build-kernel.sh)
          cur_61=$(awk -F'"'  '/6\.1\)[[:space:]]+TAG=/  {print $2}' scripts/build-kernel.sh)

          if [ -z "$cur_510" ] || [ -z "$cur_61" ]; then
            echo "could not parse current pins from scripts/build-kernel.sh" >&2
            echo "(got cur_510='$cur_510' cur_61='$cur_61')" >&2
            exit 1
          fi

          {
            echo "new_510=$new_510"
            echo "new_61=$new_61"
            echo "cur_510=$cur_510"
            echo "cur_61=$cur_61"
          } >> "$GITHUB_OUTPUT"

          echo "Current: 5.10=$cur_510  6.1=$cur_61"
          echo "Latest:  5.10=$new_510  6.1=$new_61"

          if [ "$new_510" = "$cur_510" ] && [ "$new_61" = "$cur_61" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip — already at latest
        if: steps.tags.outputs.changed == 'false'
        run: echo "Nothing to do."

      - name: Rewrite scripts/build-kernel.sh
        if: steps.tags.outputs.changed == 'true'
        # The substitution anchors on the case-label rather than the
        # current value, so we don't have to deal with regex-escaping
        # dots and dashes in the old tag string. Running both seds
        # unconditionally is fine — if a line is already at the
        # latest, the substitution replaces the value with itself
        # and `git diff` shows no change.
        run: |
          set -eu
          sed -i -E 's|(5\.10\)[[:space:]]+TAG=)"[^"]+"|\1"${{ steps.tags.outputs.new_510 }}"|' scripts/build-kernel.sh
          sed -i -E 's|(6\.1\)[[:space:]]+TAG=)"[^"]+"|\1"${{ steps.tags.outputs.new_61 }}"|'  scripts/build-kernel.sh
          git diff scripts/build-kernel.sh

      - name: Open or refresh PR
        if: steps.tags.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_510: ${{ steps.tags.outputs.new_510 }}
          NEW_61:  ${{ steps.tags.outputs.new_61 }}
          CUR_510: ${{ steps.tags.outputs.cur_510 }}
          CUR_61:  ${{ steps.tags.outputs.cur_61 }}
        run: |
          set -eu
          branch=auto/kernel-bump

          # If an open PR on this branch already proposes the same
          # NEW_510 + NEW_61, do nothing — re-pushing identical
          # content would just churn the PR's commit list with
          # timestamp-only new commits.
          open_body=$(gh pr list --head "$branch" --state open --json body -q '.[0].body // ""')
          if [ -n "$open_body" ] \
              && printf '%s' "$open_body" | grep -qF "$NEW_510" \
              && printf '%s' "$open_body" | grep -qF "$NEW_61"; then
            echo "Open PR on $branch already proposes 5.10→$NEW_510 and 6.1→$NEW_61; skipping."
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add scripts/build-kernel.sh
          git commit -m "ci: bump amazonlinux/linux kernel tags

          5.10: ${CUR_510} → ${NEW_510}
          6.1:  ${CUR_61}  → ${NEW_61}"
          git push -f origin "$branch"

          # Write the body to a file so YAML indentation doesn't
          # accidentally end up in the rendered Markdown.
          cat > /tmp/pr-body.md <<EOF
          Nightly check found newer amazonlinux/linux tags on the 5.10 and 6.1 microvm-kernel lines.

          | line | from | to |
          |------|------|----|
          | 5.10 | \`${CUR_510}\` | \`${NEW_510}\` |
          | 6.1  | \`${CUR_61}\`  | \`${NEW_61}\` |

          On merge, the next \`v*\` tag publishes kernels built from the new sources.
          EOF

          if [ -z "$(gh pr list --head "$branch" --state open --json number -q '.[0].number')" ]; then
            gh pr create \
              --title "ci: bump amazonlinux/linux kernel tags" \
              --body-file /tmp/pr-body.md \
              --head "$branch"
          else
            echo "Existing PR refreshed via force-push."
          fi
